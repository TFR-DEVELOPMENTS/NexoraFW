<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Loading Nexoro</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="bg"></div><div id="lines"></div>
<main>
  <header><div class="logo" id="logo">Nexoro</div><div id="tagline"></div></header>
  <section id="panel"><h2 id="ptitle"></h2><p id="pbody"></p><div id="dots"></div></section>
  <aside id="side"><h3>Rules</h3><ol id="rules"></ol><h3>Community</h3><p id="community"></p><div id="social"></div></aside>
  <footer>
    <div id="ticker"></div>
    <div id="status"><span id="stext">Starting up</span><div class="track"><i id="fill"></i></div><span id="pct">0%</span></div>
    <div id="music"><button id="play" type="button" aria-label="Play or pause music">❚❚</button><button id="mute" type="button" aria-label="Mute">♪</button><input id="vol" type="range" min="0" max="100" aria-label="Volume"><span id="mhint"></span></div>
    <div id="dev"></div>
  </footer>
</main>
<audio id="audio" loop preload="auto"></audio>
<script src="config.js"></script><script src="app.js"></script></body></html>
