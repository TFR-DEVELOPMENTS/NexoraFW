<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Nexoro Character</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
  <aside class="panel">
    <header class="brand">
      <span class="logo">Nexoro</span>
      <span class="dev">Nexoro Network Team</span>
    </header>

    <section id="screen-select">
      <h1>Choose your character</h1>
      <div id="slots"></div>
    </section>

    <section id="screen-create" class="hidden">
      <h1 id="create-title">Create your character</h1>
      <nav id="tabs" role="tablist"></nav>
      <div id="tab-body"></div>
      <div class="actions">
        <button id="btn-back" class="ghost" type="button">Back</button>
        <button id="btn-submit" class="primary" type="button">Create character</button>
      </div>
    </section>

    <p id="toast" class="hidden" role="alert"></p>
  </aside>

  <div id="rotate" class="hidden">
    <label for="rot">Rotate</label>
    <input id="rot" type="range" min="-180" max="180" value="0" step="1">
  </div>

  <div id="modal" class="hidden">
    <div class="dialog">
      <h2>Delete this character?</h2>
      <p id="modal-text"></p>
      <input id="modal-input" type="text" autocomplete="off" spellcheck="false">
      <div class="actions">
        <button id="modal-cancel" class="ghost" type="button">Keep character</button>
        <button id="modal-confirm" class="danger" type="button" disabled>Delete permanently</button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
