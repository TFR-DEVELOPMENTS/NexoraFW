<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Nexoro HUD</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="hud" class="hidden" data-pos="bottom-right">
  <section id="location" data-el="location"><div id="compass"></div><div id="street"></div><div id="zone"></div></section>
  <section id="top" data-el="identity"><div id="who"></div><div id="job"></div></section>
  <section id="money" data-el="money"><div><span>Cash</span><b id="cash"></b></div><div><span>Bank</span><b id="bank"></b></div></section>
  <section id="rings"></section>
  <section id="voice" data-el="voice"><i id="mic"></i><span id="vmode"></span><span id="radio"></span></section>
  <section id="vehicle" class="hidden" data-el="vehicle"><div class="speed"><b id="spd">0</b><span>MPH</span></div><div class="vrow"><span>Fuel</span><div class="bar"><i id="fuel"></i></div></div><div class="vrow"><span>Engine</span><div class="bar"><i id="eng"></i></div></div><div id="belt"></div></section>
</div>
<script src="app.js"></script></body></html>
