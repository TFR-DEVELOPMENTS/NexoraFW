# txAdmin recipe for the Nexoro roleplay framework.
# Import it in txAdmin (Setup > Recipes) or paste it into the recipe editor, then answer the prompts.
name: Nexoro Roleplay Framework
description: UK FiveM roleplay framework by Nexoro Network Team / Nexoro Network Team. Installs every Nexoro resource and a ready server.cfg.
version: v1.0.0-beta

variables:
  - name: serverName
    description: The name shown in the server list.
    default: Nexoro Roleplay
  - name: licenseKey
    description: Your FiveM server licence key (from keymaster.fivem.net).
    required: true
  - name: ownerLicense
    description: Your own FiveM licence identifier (license:xxxxxxxx). You become owner of the server.
    required: true
  - name: dbPassword
    description: Password for the MariaDB user "nexoro" (create it first, see README).
    required: true
  - name: dbHost
    description: MariaDB host.
    default: localhost
  - name: dbName
    description: MariaDB database name.
    default: nexoro

tasks:
  - action: download_github
    repo: TFR-DEVELOPMENTS/nexoro-framework
    ref: main
    subpath: resources/[nexoro]
    dest: ./resources/[nexoro]

  - action: write_file
    file: ./server.cfg
    data: |
      # Nexoro server.cfg (generated by the recipe)
      endpoint_add_tcp "0.0.0.0:30120"
      endpoint_add_udp "0.0.0.0:30120"
      sv_maxclients 32
      sv_hostname "{{ serverName }}"
      sv_licenseKey "{{ licenseKey }}"
      set onesync on
      set mysql_connection_string "mysql://nexoro:{{ dbPassword }}@{{ dbHost }}/{{ dbName }}?charset=utf8mb4"
      set sv_enforceGameBuild 3095

      # Owner: this licence is made owner on join
      set nexoro_owner_license "{{ ownerLicense }}"

      # Standard FiveM resources (do not start spawnmanager, basic-gamemode or chat)

      # Standard FiveM resources (do not start spawnmanager, basic-gamemode or chat)
      ensure mapmanager
      ensure sessionmanager
      ensure oxmysql

      # Nexoro, in dependency order
      ensure nexoro_database
      ensure nexoro_core
      ensure nexoro_identity
      ensure nexoro_loading
      ensure nexoro_ui
      ensure nexoro_notifications
      ensure nexoro_character
      ensure nexoro_banking
      ensure nexoro_inventory
      ensure nexoro_chat
      ensure nexoro_phone
      ensure nexoro_hud
      ensure nexoro_menu
      ensure nexoro_vehicles
      ensure nexoro_garages
      ensure nexoro_dealerships
      ensure nexoro_emergency
      ensure nexoro_police
      ensure nexoro_ambulance
      ensure nexoro_fire
      ensure nexoro_dispatch
      ensure nexoro_tablet
      ensure nexoro_lighting
      ensure nexoro_map
      ensure nexoro_death
      ensure nexoro_world
      ensure nexoro_driving
      ensure nexoro_shops
      ensure nexoro_crafting
      ensure nexoro_courts
      ensure nexoro_prison
      ensure nexoro_housing
      ensure nexoro_taxi
      ensure nexoro_licences
      ensure nexoro_businesses
      ensure nexoro_postal
      ensure nexoro_fishing
      ensure nexoro_transport
      ensure nexoro_pawn
      ensure nexoro_auctions
      ensure nexoro_robbery
      ensure nexoro_farming
      ensure nexoro_gambling
      ensure nexoro_lottery
      ensure nexoro_scratchcards
      ensure nexoro_supplydrop
      ensure nexoro_crews
      ensure nexoro_hunting
      ensure nexoro_encampments
      ensure nexoro_scrapping
      ensure nexoro_traveller_site
      ensure nexoro_crime
      ensure nexoro_markets
      ensure nexoro_civilian
      ensure nexoro_devtools
      ensure nexoro_admin
