# txAdmin recipe for the Nexoro roleplay framework.
# Import it in txAdmin (Setup > Recipes), then answer the prompts.
name: Nexoro Roleplay Framework
description: UK FiveM roleplay framework by Nexoro Network Team. Installs the standard FiveM resources, oxmysql, and every Nexoro resource, with a ready server.cfg.
version: v1.0.0-beta

variables:
  - name: serverName
    description: The name shown in the server list.
    default: Nexoro Roleplay
  - name: licenseKey
    description: Your FiveM server licence key (from keymaster.fivem.net).
    required: true
  - name: ownerLicense
    description: Your own FiveM licence identifier (license:xxxxxxxx). You become owner of the server.
    required: true
  - name: dbHost
    description: MariaDB host.
    default: localhost
  - name: dbPort
    description: MariaDB port.
    default: "3306"
  - name: dbName
    description: MariaDB database name. Create it first; the framework creates its own tables.
    default: nexoro
  - name: dbUser
    description: MariaDB user with full rights on the database above.
    default: nexoro
  - name: dbPassword
    description: Password for that MariaDB user.
    required: true

tasks:
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: download_github
    src: https://github.com/overextended/oxmysql
    ref: main
    dest: ./resources/[standalone]/oxmysql

  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/bob74_ipl

  - action: download_github
    src: https://github.com/YOUR_GITHUB_USERNAME/nexoro-framework
    ref: main
    subpath: resources/[nexoro]
    dest: ./resources/[nexoro]

  - action: write_file
    file: ./server.cfg
    data: |
      # Nexoro server.cfg. Generated by recipe.yaml. Edit there, or edit this file on your own server.
      endpoint_add_tcp "0.0.0.0:30120"
      endpoint_add_udp "0.0.0.0:30120"
      sv_maxclients 32
      sv_hostname "{{ serverName }}"
      sv_licenseKey "{{ licenseKey }}"
      set onesync on
      set mysql_connection_string "mysql://{{ dbUser }}}:{{ dbPassword }}@{{ dbHost }}:{{ dbPort }}/{{ dbName }}?charset=utf8mb4"
      set sv_enforceGameBuild 3095

      # Owner: the licence below is made owner on join
      set nexoro_owner_license "{{ ownerLicense }}"

      # Standard FiveM resources. spawnmanager, basic-gamemode and chat are NOT started: Nexoro replaces them.
      ensure hardcap
      ensure rconlog
      ensure mapmanager
      ensure sessionmanager
      ensure oxmysql
      ensure bob74_ipl

      # Nexoro, in dependency order
      ensure nexoro_database
      ensure nexoro_core
      ensure nexoro_identity
      ensure nexoro_loading
      ensure nexoro_ui
      ensure nexoro_notifications
      ensure nexoro_character
      ensure nexoro_banking
      ensure nexoro_inventory
      ensure nexoro_chat
      ensure nexoro_phone
      ensure nexoro_hud
      ensure nexoro_menu
      ensure nexoro_vehicles
      ensure nexoro_garages
      ensure nexoro_dealerships
      ensure nexoro_emergency
      ensure nexoro_police
      ensure nexoro_ambulance
      ensure nexoro_fire
      ensure nexoro_dispatch
      ensure nexoro_tablet
      ensure nexoro_lighting
      ensure nexoro_map
      ensure nexoro_death
      ensure nexoro_world
      ensure nexoro_driving
      ensure nexoro_shops
      ensure nexoro_crafting
      ensure nexoro_courts
      ensure nexoro_prison
      ensure nexoro_housing
      ensure nexoro_taxi
      ensure nexoro_licences
      ensure nexoro_businesses
      ensure nexoro_postal
      ensure nexoro_fishing
      ensure nexoro_transport
      ensure nexoro_pawn
      ensure nexoro_auctions
      ensure nexoro_robbery
      ensure nexoro_farming
      ensure nexoro_gambling
      ensure nexoro_lottery
      ensure nexoro_scratchcards
      ensure nexoro_supplydrop
      ensure nexoro_crews
      ensure nexoro_hunting
      ensure nexoro_encampments
      ensure nexoro_scrapping
      ensure nexoro_traveller_site
      ensure nexoro_crime
      ensure nexoro_markets
      ensure nexoro_gunshop
      ensure nexoro_loans
      ensure nexoro_emotes
      ensure nexoro_premium
      ensure nexoro_stations
      ensure nexoro_britain
      ensure nexoro_civilian
      ensure nexoro_devtools
      ensure nexoro_admin
